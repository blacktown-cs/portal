<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CS Education Parent Portal</title>
<meta name="theme-color" content="#b01319">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CS Portal">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
/* Layout idea: a year rail across the top, weekly topics as the main column, the child's results beside it. */
:root{
  /* CS Education brand, taken from the Blacktown campus business card: white card, black type, red marks,
     a deep red label strip and a striped red band along the bottom. Single light theme by choice. */
  --bg:#f6f4f4; --surface:#ffffff; --ink:#231f20; --muted:#6a6465; --line:#e3dddd;
  --red:#ed1c24; --red-deep:#b01319; --soft:#f1eaea; --bad:#8a4b00;
  --accent:var(--red-deep); --accent-ink:#ffffff; --mark:var(--ink);
  --stripes:linear-gradient(90deg,#ed1c24 0 8.33%,#d91920 8.33% 16.66%,#cd171e 16.66% 25%,#ed1c24 25% 33.33%,#cd171e 33.33% 41.66%,#ed1c24 41.66% 50%,#d91920 50% 58.33%,#cd171e 58.33% 66.66%,#ed1c24 66.66% 75%,#cd171e 75% 83.33%,#ed1c24 83.33% 91.66%,#d91920 91.66% 100%);
  --display:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;min-height:100%;display:flex;flex-direction:column}
.wrap{max-width:1080px;width:100%;margin:0 auto;padding:0 20px}
main.wrap{flex:1 0 auto;padding-bottom:48px}
.mast{background:var(--surface);border-bottom:1px solid var(--line)}
.logo{display:block;flex:0 0 auto}
.logo svg{display:block;height:46px;width:auto}
@media (max-width:520px){.logo svg{height:36px}}
.brandrow{display:flex;align-items:center;gap:14px 18px;flex-wrap:wrap}
.campus{background:var(--red-deep);color:#fff;font-size:.95rem;padding:4px 14px;letter-spacing:.01em;font-weight:400}
.campus b{font-weight:700}
.title{font-size:1.9rem;line-height:1.1;font-weight:400;margin:26px 0 18px;letter-spacing:-.01em;text-wrap:balance}
.title b{font-weight:800}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.foot{flex:0 0 auto;color:#fff}
.foot-strip{background:var(--red-deep);font-size:.9rem;font-weight:500}
.foot-strip .wrap{padding-top:12px;padding-bottom:12px;display:flex;flex-wrap:wrap;gap:4px 22px}
.foot-strip b{font-weight:700}
.foot-band{height:34px;background:var(--stripes)}
header.top{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;justify-content:space-between;padding:16px 0}
.brand{font-family:var(--display);font-weight:700;font-size:1.7rem;line-height:1.1;margin:0;text-wrap:balance}
.brand span{display:block;font-family:var(--body);font-weight:600;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.meta{color:var(--muted);font-size:.9rem;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
select,input,button{font:inherit;color:inherit}
select,input[type=text]{background:var(--surface);border:1px solid #bdb5b6;border-radius:4px;padding:8px 10px}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.demo{background:var(--surface);border:1px dashed var(--red-deep);border-radius:4px;padding:10px 14px;margin-bottom:16px;font-size:.92rem}
.demo code{font-weight:700;letter-spacing:.04em}
nav.years{display:flex;gap:6px;overflow-x:auto;padding:4px 0 14px}
nav.years a{flex:0 0 auto;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:600;font-size:.92rem}
nav.years a.has{border-color:var(--accent)}
nav.years a[aria-current="page"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
nav.years a.none{color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr;gap:22px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
h2{font-family:var(--display);font-size:1.2rem;font-weight:700;margin:0 0 12px;text-wrap:balance}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px}
.stack{display:flex;flex-direction:column;gap:14px}
.week-head{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.week-head h3{margin:0;font-size:1.02rem;font-weight:700}
.pill{background:var(--red-deep);color:#fff;border-radius:2px;font-size:.72rem;font-weight:700;padding:2px 9px;letter-spacing:.03em;text-transform:uppercase}
.topic{display:grid;grid-template-columns:150px minmax(0,1fr);gap:4px 14px;padding:10px 0;border-top:1px solid var(--line)}
.topic:first-of-type{border-top:0;padding-top:0}
.topic:last-child{padding-bottom:0}
@media (max-width:520px){.topic{grid-template-columns:1fr}}
.subj{font-weight:700;font-size:.85rem;color:var(--red-deep)}
.hw{color:var(--muted);font-size:.9rem;margin-top:2px}
.hw b{font-weight:600;color:var(--ink)}
.empty{color:var(--muted);margin:0}
form.code{display:flex;flex-direction:column;gap:10px}
form.code label{font-weight:600;font-size:.92rem}
form.code input{font-size:1.1rem;letter-spacing:.12em;text-transform:uppercase;width:100%}
.btn{background:var(--red-deep);color:#fff;border:0;border-radius:4px;padding:10px 14px;font-weight:700;cursor:pointer}
.btn[disabled]{opacity:.6;cursor:progress}
.link{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer;font-size:.9rem}
.help{color:var(--muted);font-size:.88rem;margin:0}
.err{color:var(--bad);font-size:.9rem;margin:0;font-weight:700;border-left:3px solid var(--bad);padding-left:9px}
.child{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.child strong{font-size:1.08rem}
.res{padding:14px 0;border-top:1px solid var(--line)}
.res-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.res-title{font-weight:600}
.res-sub{color:var(--muted);font-size:.85rem}
.score{font-family:var(--display);font-weight:700;font-size:1.35rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.score small{font-family:var(--body);font-weight:500;font-size:.85rem;color:var(--muted)}
.bar{position:relative;height:10px;border-radius:2px;background:var(--soft);margin:10px 0 6px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--red)}
.bar b{position:absolute;top:-4px;bottom:-4px;width:3px;margin-left:-1px;border-radius:2px;background:var(--mark)}
.cap{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.cap .k{display:inline-block;width:3px;height:11px;background:var(--mark);border-radius:2px;margin-right:5px;vertical-align:-1px}
/* Notices lead the page: a red banner heading over a tinted card, so they are the first thing a parent sees. */
#notices h2{background:var(--red-deep);color:#fff;margin:0;padding:11px 18px;border-radius:6px 6px 0 0;font-size:1.15rem;display:flex;align-items:center;gap:10px}
#notices h2 .count{background:#fff;color:var(--red-deep);border-radius:999px;font-size:.78rem;font-weight:800;padding:2px 10px}
.notices{margin-bottom:26px;padding-top:6px;padding-bottom:6px;border:2px solid var(--red-deep);border-top:0;border-radius:0 0 6px 6px;background:#fff8f7}
.reports{margin-top:0}#reports h2{margin-top:22px}
.notice{padding:12px 0;border-top:1px solid var(--line)}
.notice:first-child{border-top:0}
.n-head{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.n-date .only{color:var(--red-deep)}
.n-head h3{margin:0;font-size:1.1rem;font-weight:800}
.n-date{color:var(--muted);font-size:.85rem;margin-left:auto}
.notice p{margin:6px 0 0;white-space:pre-line;max-width:70ch}
.notices details{border-top:1px solid var(--line);padding:10px 0}
.notices summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:.92rem}
.gate{max-width:460px;margin:8px auto 0;padding:26px;border-top:4px solid var(--red)}
.gate h2{margin-bottom:6px}
.gate form{margin-top:14px}
.who{border-left:4px solid var(--red);display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:20px;padding:12px 18px}
.who strong{font-size:1.08rem}
.hwbox{margin-top:14px}.hwbox-h{font-weight:700;font-size:.95rem}.hwbox .msg-links{margin-top:8px;font-size:.9rem}
.hwbox .hwc{margin-top:8px}
.hwc{margin-top:12px;padding:10px 12px;border-left:4px solid var(--line);background:#faf8f8;border-radius:0 4px 4px 0;font-size:.95rem}
.hwc b{font-weight:700}.hwc p{margin:4px 0 0;white-space:pre-line}
.hwc.done{border-left-color:#1a7f47}
/* Homework that was not done, or only partly done, must stand out: a tinted box, a heavier edge and a solid label. */
.hwc.part{border-left:6px solid #c77700;background:#fff1d6;border-top:1px solid #f0cf8f;border-right:1px solid #f0cf8f;border-bottom:1px solid #f0cf8f}
.hwc.no{border-left:6px solid var(--red);background:#fde3e3;border-top:1px solid #f2a7a7;border-right:1px solid #f2a7a7;border-bottom:1px solid #f2a7a7}
.hwc .st{display:inline-block;border-radius:4px;padding:1px 9px;font-weight:800;font-size:.86rem;margin-left:4px;vertical-align:1px}
.hwc.done .st{background:#e4f4ea;color:#14633a}.hwc.part .st{background:#c77700;color:#fff}.hwc.no .st{background:var(--red-deep);color:#fff}
.install{margin-bottom:20px;padding:12px 18px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.install .btn{width:auto;margin:0}
.install ol{margin:6px 0 0;padding-left:20px}.install .acts{display:flex;gap:14px;align-items:center}
.contact{margin-top:22px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.contact .btn,.msg-links .btn{width:auto;margin:0;text-decoration:none;display:inline-block}
.btn.ghost{background:var(--surface);color:var(--red-deep);border:1px solid var(--red-deep)}
.msg-links{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.hwc .msg-links{margin-top:8px;font-size:.9rem}
.reports{margin-bottom:22px}
.rep{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line)}
.rep:first-child{border-top:0;padding-top:0}.rep:last-child{padding-bottom:0}
.rep-links{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.viewer{flex-basis:100%;margin-top:4px;background:#ece8e8;padding:8px;border-radius:4px}
.viewer img{display:block;width:100%;height:auto}
.res .att{border-top:0;padding-top:0}
.att{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.att .btn{width:auto;margin:0;padding:7px 14px;text-decoration:none;display:inline-block}
.att-name{font-weight:600;word-break:break-word}
.att .viewer{margin-top:10px}
.viewer canvas{display:block;width:100%;height:auto;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.viewer canvas+canvas{margin-top:8px}
.rep .btn{width:auto;margin:0;text-decoration:none;display:inline-block}
#results .res:first-child{border-top:0;padding-top:0}
#results .res:last-child{padding-bottom:0}
footer{margin-top:28px;color:var(--muted);font-size:.86rem}
</style>
</head>

<script>/* Shared logic for the office tool and the parent portal. No DOM access here. */
const CS = (() => {
  const ALPHA = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; // 31 characters, no I L O 0 1
  /* Groups a student can belong to: Year 1 to 12, plus the two trial test classes. A student is in exactly one. */
  const TRIAL = { ST: 'Selective Trial', OC: 'OC Trial' };
  const YEARS = Array.from({ length: 12 }, (_, i) => 'Y' + (i + 1)).concat(Object.keys(TRIAL));
  const SUBJECTS = ['Mathematics', 'English', 'Reading', 'Writing', 'Thinking Skills', 'Mathematical Reasoning', 'General Ability', 'Science'];
  const ITER = 200000;
  const MIN_FOR_AVERAGE = 3; // below this a class average would reveal another child's mark
  const enc = new TextEncoder(), dec = new TextDecoder();

  const b64 = u8 => { let s = ''; for (const b of u8) s += String.fromCharCode(b); return btoa(s); };
  const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const hex = u8 => Array.from(u8, b => b.toString(16).padStart(2, '0')).join('');
  const normCode = c => String(c || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const isTrial = g => !!TRIAL[g]; // trial classes get notices only: no weekly topics or mini tests
  const yearLabel = y => TRIAL[y] || 'Year ' + String(y).replace(/^Y/i, '');

  function newCode() {
    let out = ''; const buf = new Uint8Array(1);
    while (out.length < 10) { crypto.getRandomValues(buf); if (buf[0] < 248) out += ALPHA[buf[0] % 31]; }
    return out.slice(0, 5) + '-' + out.slice(5);
  }

  async function derive(code, saltB64, iter) {
    const km = await crypto.subtle.importKey('raw', enc.encode(normCode(code)), 'PBKDF2', false, ['deriveBits']);
    const bits = new Uint8Array(await crypto.subtle.deriveBits(
      { name: 'PBKDF2', salt: b64d(saltB64), iterations: iter, hash: 'SHA-256' }, km, 384));
    const key = await crypto.subtle.importKey('raw', bits.slice(16, 48), 'AES-GCM', false, ['encrypt', 'decrypt']);
    return { tag: hex(bits.slice(0, 16)), key };
  }

  async function seal(obj, code, saltB64, iter) {
    const { tag, key } = await derive(code, saltB64, iter);
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(JSON.stringify(obj))));
    return { tag, iv: b64(iv), ct: b64(ct) };
  }

  /* Returns the child's record, or null when the code matches nothing. */
  async function open(D, code) {
    if (normCode(code).length < 6) return null;
    const { tag, key } = await derive(code, D.salt, D.iter);
    const b = D.blobs[tag];
    if (!b) return null;
    try {
      const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(b.iv) }, key, b64d(b.ct));
      return JSON.parse(dec.decode(pt));
    } catch (e) { return null; }
  }

  /* A report PDF is locked with its own random key before it is uploaded. The key travels inside the
     child's sealed record, so the uploaded file is unreadable to anyone else. Layout: 12-byte iv, then the data. */
  async function sealFile(bytes) {
    const raw = crypto.getRandomValues(new Uint8Array(32)), iv = crypto.getRandomValues(new Uint8Array(12));

  }

  function emptyState() {
    return {

      centre: { name: 'CS Education Blacktown', phone: '02 9621 7711', email: 'blacktown@cseducation.com.au', address: 'Level 1, 19 Campbell St, Blacktown NSW 2148' },
      current: { yr: new Date().getFullYear(), t: 4, w: 0 }, // w 0 = show every week of the term

  /* Opens the topics and notices for the child's year, using the year key held inside the child's record. */

  /* A student has one year (or one trial class), and may also be in a trial class on top of a year. */
  const groupsOf = s => [s.year].concat(s.extra && isTrial(s.extra) && s.extra !== s.year && !isTrial(s.year) ? [s.extra] : []);

  function mergeHw(a, b) {

    const list = state.students.filter(s => normCode(s.code) && isActive(s));

        /* a personal notice never goes into a year's shared list: it travels only inside the chosen children's own records */
        notices: (state.notices || []).filter(n => !n.personal && (!n.years || !n.years.length || n.years.includes(y))).map(noticeOut)
      };
      const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(JSON.stringify(content))));

(function(){
  const D = window.PORTAL_DATA;
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  if (!D) { $('gate').innerHTML = '<h2 id="h-gate">The portal is being set up</h2><p class="empty">Please check back soon.</p>'; return; }

  const KEY = 'cs_portal_code';
  const remember = { get(){ try { return localStorage.getItem(KEY) || ''; } catch(e){ return ''; } },
                     set(v){ try { v ? localStorage.setItem(KEY, v) : localStorage.removeItem(KEY); } catch(e){} } };
  let child = null, content = { topics: [], notices: [] }, term = D.current.yr + '-' + D.current.t, busy = false, error = '';

  const termKey = x => x.yr + '-' + x.t;
  function terms(){
    const set = new Set([D.current.yr + '-' + D.current.t]);
    content.topics.forEach(x => set.add(termKey(x)));
    child.results.forEach(x => set.add(termKey(x)));
    return [...set].sort((a, b) => { const [ay, at] = a.split('-').map(Number), [by, bt] = b.split('-').map(Number); return by - ay || bt - at; });
  }

  function renderGate(){
    $('gate').innerHTML = `<h2 id="h-gate">Enter your child's access code</h2>
      <p class="help">Weekly topics, notices, mini test results and term test reports are shown to enrolled families only.</p>
      <form class="code" id="codeform" novalidate>
        <label for="code">Access code</label>
        <input type="text" id="code" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXXX-XXXXX" maxlength="14">
        ${error ? `<p class="err" role="alert">${esc(error)}</p>` : ''}
        <button class="btn" type="submit"${busy ? ' disabled' : ''}>${busy ? 'Checking…' : 'Open the portal'}</button>
        <p class="help">The code is on the letter from the office. If you have lost it, call ${esc(D.centre.phone)}.</p></form>`;
  }
  function renderNotices(){
    const list = [...content.notices].sort((a, b) => b.date.localeCompare(a.date));
    attList = [];
    if (!list.length) { $('notices').innerHTML = ''; return; }
    const fresh = n => new Date(D.generated) - new Date(n.date) < 7 * 864e5;
    const item = n => `<article class="notice"><div class="n-head"><h3>${esc(n.title)}</h3>${fresh(n) ? '<span class="pill">New</span>' : ''}
      <span class="n-date">${new Date(n.date).toLocaleDateString('en-AU', { day: 'numeric', month: 'short' })} · ${n.personal ? `<b class="only">For ${esc(String(child.name).split(' ')[0])} only</b>` : n.years && n.years.length ? esc(n.years.map(CS.yearLabel).join(', ')) : 'All years'}</span></div><p>${esc(n.body)}</p>${(n.files || []).map(f => attHtml(f)).join('')}</article>`;
    const newCount = list.filter(fresh).length;
    $('notices').innerHTML = `<h2>Notices${newCount ? `<span class="count">${newCount} new</span>` : ''}</h2><div class="card notices">${list.slice(0, 3).map(item).join('')}` +
      (list.length > 3 ? `<details${earlierOpen ? ' open' : ''}><summary>Earlier notices (${list.length - 3})</summary>${list.slice(3).map(item).join('')}</details>` : '') + '</div>';
    attMount($('notices'), attList, 'att');
    const d = $('notices').querySelector('details'); if (d) d.addEventListener('toggle', () => { earlierOpen = d.open; });
  }
  let earlierOpen = false;
  /* Term test reports: each is a locked PDF, fetched and unlocked in the browser with the key from the child's
     record, then drawn page by page inside this page. Phones often refuse to open such a file in a new tab. */
  const repState = {}; // file -> { busy, url, err, pages, hidden, noview }
  const LIB = 'lib/pdfjs-3.11.174/';
  const onPortal = /^https?:$/.test(location.protocol) && !D.preview; // a preview from the office tool fetches from the portal address
  const at = path => onPortal ? path : new URL(path, D.base || location.href).href;
  const repList = () => [...(child.reports || [])].sort((a, b) => b.yr - a.yr || b.t - a.t);
  let pdfLib = null;
  function loadPdfLib(){
    return pdfLib || (pdfLib = new Promise((ok, fail) => {
      const s = document.createElement('script'); s.src = at(LIB + 'pdf.min.js');
      s.onload = () => { const L = window.pdfjsLib; if (!L) return fail(new Error('viewer')); L.GlobalWorkerOptions.workerSrc = at(LIB + 'pdf.worker.min.js'); ok(L); };
      s.onerror = () => fail(new Error('viewer')); document.head.appendChild(s);
    }).catch(e => { pdfLib = null; throw e; }));
  }
  function renderReports(){
    const list = repList();
    if (!list.length) { $('reports').innerHTML = ''; return; }
    $('reports').innerHTML = '<h2>Term test report</h2><div class="card reports">' + list.map((r, i) => { const st = repState[r.file] || {};
      const fname = `${child.name} Term ${r.t} ${r.yr} Term Test Report.pdf`, shown = st.pages && !st.hidden;
      return `<div class="rep"><div><div class="res-title">Term ${esc(r.t)}, ${esc(r.yr)} Term Test Report</div><div class="res-sub">PDF${r.size ? ' · ' + Math.max(1, Math.round(r.size / 1024)) + ' KB' : ''} · for ${esc(child.name)} only</div>
        ${st.err ? `<p class="err" role="alert">${esc(st.err)}</p>` : ''}${st.noview ? '<p class="help">This device could not show the report on the page. Open or download it instead.</p>' : ''}</div>
        <div class="rep-links">${st.pages ? `<button class="btn" type="button" data-reptoggle="${i}">${shown ? 'Hide report' : 'Show report'}</button>` : st.noview ? `<a class="btn" href="${st.url}" target="_blank" rel="noopener">Open report</a>`
          : `<button class="btn" type="button" data-rep="${i}"${st.busy ? ' disabled' : ''}>${st.busy ? 'Opening…' : 'Open report'}</button>`}${st.url ? `<a href="${st.url}" download="${esc(fname)}">Download</a>` : ''}</div>
        ${shown ? `<div class="viewer" data-view="${i}"></div>` : ''}</div>`; }).join('') + '</div>';
    list.forEach((r, i) => { const st = repState[r.file], box = $('reports').querySelector(`[data-view="${i}"]`); if (st && st.pages && box) st.pages.forEach(c => box.appendChild(c)); });
  }
  /* Fetch a locked file, unlock it, and prepare it for the page: PDF pages are drawn, pictures are shown as they are. */
  async function fetchAndDraw(r, st, type, word){
    let data;
    try {
      let bytes;
      if (r.inline) bytes = CS.b64d(r.inline);
      else { const ac = new AbortController(), timer = setTimeout(() => ac.abort(), 30000);

        if (!f.ok) throw new Error('missing'); bytes = new Uint8Array(await f.arrayBuffer()); }
      data = await CS.openFile(bytes, r.key);
      st.url = URL.createObjectURL(new Blob([data], { type: type || 'application/octet-stream' }));
    } catch (e) { st.err = `The ${word} could not be opened. Please try again in a few minutes, or call ${D.centre.phone}.`; return; }
    if (/^image\//.test(type)) { st.img = true; return; }
    if (!/pdf/.test(type)) { st.noview = true; return; }
    try {
      const L = await loadPdfLib(), doc = await L.getDocument({ data: data.slice() }).promise, pages = [];
      const cssW = Math.min(900, Math.max(280, $('reports').parentNode.clientWidth - 40)), dpr = Math.min(Math.max(window.devicePixelRatio || 1, 2), 3);
      for (let n = 1; n <= doc.numPages; n++) {
        const page = await doc.getPage(n), vp = page.getViewport({ scale: cssW / page.getViewport({ scale: 1 }).width * dpr });
        const c = document.createElement('canvas'); c.width = Math.floor(vp.width); c.height = Math.floor(vp.height); c.setAttribute('role', 'img'); c.setAttribute('aria-label', `Page ${n} of ${doc.numPages}`);
        await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise; pages.push(c);
      }
      st.pages = pages;
    } catch (e) { st.noview = true; }
  }
  /* Files attached to a notice (a newsletter, a brochure) use the same locked-file route as the reports. */
  /* The same goes for a scanned mini test paper, shown under that test's result. */
  let attList = [], paperList = [];
  const attType = f => f.type || (/\.pdf$/i.test(f.name || '') ? 'application/pdf' : '');
  function attHtml(f, list, pfx){
    list = list || attList; pfx = pfx || 'att';
    const k = list.push(f) - 1, st = repState[f.file] || {}, shown = (st.pages || st.img) && !st.hidden;
    return `<div class="att"><div class="rep-links"><span class="att-name">${esc(f.label || f.name)}</span>${f.size ? `<span class="res-sub">${Math.max(1, Math.round(f.size / 1024))} KB</span>` : ''}
      ${st.pages || st.img ? `<button class="btn" type="button" data-${pfx}toggle="${k}">${shown ? 'Hide' : 'Show'}</button>` : st.url ? `<a class="btn" href="${st.url}" target="_blank" rel="noopener">Open</a>`
        : `<button class="btn" type="button" data-${pfx}="${k}"${st.busy ? ' disabled' : ''}>${st.busy ? 'Opening…' : 'Open'}</button>`}${st.url ? `<a href="${st.url}" download="${esc(f.name)}">Download</a>` : ''}</div>
      ${st.err ? `<p class="err" role="alert">${esc(st.err)}</p>` : ''}${shown ? (st.img ? `<div class="viewer"><img src="${st.url}" alt="${esc(f.label || f.name)}"></div>` : `<div class="viewer" data-${pfx}view="${k}"></div>`) : ''}</div>`;
  }
  function attMount(root, list, pfx){ list.forEach((f, k) => { const st = repState[f.file], box = root.querySelector(`[data-${pfx}view="${k}"]`); if (st && st.pages && box) st.pages.forEach(c => box.appendChild(c)); }); }
  async function openAtt(k, list, redraw, word){
    const f = list[k]; if (!f) return;
    const st = repState[f.file] = { busy: true }, who = child;
    redraw();
    await fetchAndDraw(f, st, attType(f), word);
    st.busy = false; if (child === who) redraw();
  }
  async function openReport(i){
    const r = repList()[i]; if (!r) return;
    const st = repState[r.file] = { busy: true }, who = child;
    renderReports();
    await fetchAndDraw(r, st, 'application/pdf', 'report');
    st.busy = false; if (child === who) renderReports();
  }
  /* Browsers keep a copy of this page for several minutes. Ask the server for the newest copy in the background,
     and if the office has published since, load that one, so parents never look at an old version. */
  (async function freshen(){
    if (!onPortal || D.demo) return;
    try {
      const t = await (await fetch(location.pathname + '?t=' + Date.now(), { cache: 'no-store' })).text();
      const m = /"generated":"([^"]+)"/.exec(t);
      if (m && m[1] > D.generated && !location.search.includes(encodeURIComponent(m[1]))) { const code = curCode || window.__linked || ''; location.replace(location.pathname + '?v=' + encodeURIComponent(m[1]) + (code ? '#' + CS.normCode(code) : location.hash)); }
    } catch (e) {}
  })();
  /* Visit record: when a child's page opens, one line (name, year, class) goes to the centre's own Google Sheet,
     at most once a day per device, so the office can see which families have looked. Nothing else is sent. */
  function logVisit(){
    const v = D.visit; if (!v || !v.id || !onPortal || D.demo || !child) return;
    const tag = new Date().toISOString().slice(0, 10) + '|' + child.name;
    try { if (localStorage.getItem('cs_portal_visit') === tag) return; localStorage.setItem('cs_portal_visit', tag); } catch (e) {}
    const body = new URLSearchParams(); body.set('entry.' + v.entry, `${child.name} | ${CS.yearLabel(child.year)}${child.cls ? ' | ' + child.cls : ''}`);
    try { fetch(`https://docs.google.com/forms/d/e/${v.id}/formResponse`, { method: 'POST', mode: 'no-cors', credentials: 'omit', body }).catch(() => {}); } catch (e) {}
  }
  /* Parents cannot write on the portal. These links open the parent's own email or WhatsApp with a message
     to the office already started: who the child is and what the message is about. */
  function msgLinks(about, small){
    const who = `${child.name} (${CS.yearLabel(child.year)}${child.cls ? ', ' + child.cls : ''})`;
    const body = `Student: ${who}\nAbout: ${about}\n\nMy message:\n`;
    const mail = D.centre.email ? `mailto:${D.centre.email}?subject=${encodeURIComponent(`[Parent Portal] ${child.name}, ${CS.yearLabel(child.year)}: ${about}`)}&body=${encodeURIComponent(body)}` : '';
    let wa = String(D.centre.whatsapp || '').replace(/\D/g, ''); if (wa[0] === '0') wa = '61' + wa.slice(1);
    const waUrl = wa.length >= 9 ? `https://wa.me/${wa}?text=${encodeURIComponent(`[Parent Portal] ${body}`)}` : '';
    if (!mail && !waUrl) return '';
    return small ? `<div class="msg-links"><span>Reply to the office:</span>${mail ? `<a href="${esc(mail)}">Email</a>` : ''}${waUrl ? `<a href="${esc(waUrl)}" target="_blank" rel="noopener">WhatsApp</a>` : ''}</div>`
      : `<div class="msg-links">${mail ? `<a class="btn" href="${esc(mail)}">Email the office</a>` : ''}${waUrl ? `<a class="btn ghost" href="${esc(waUrl)}" target="_blank" rel="noopener">WhatsApp the office</a>` : ''}</div>`;
  }
  function renderContact(){
    const links = msgLinks('General question or comment');
    $('contact').innerHTML = (links ? `<div class="card contact"><div><strong>Questions or comments?</strong><div class="res-sub">Send the office a message about ${esc(child.name)}. It opens in your own email${D.centre.whatsapp ? ' or WhatsApp' : ''}.</div></div>${links}</div>` : '') + (D.visit ? `<p class="res-sub" style="margin:10px 2px 0">The centre records the date this portal is opened for ${esc(child.name)}.</p>` : '');
  }
  /* Home screen icon. Android installs the page as an app. An iPhone keeps a home screen page apart from Safari,
     so the icon must carry the child's code in its address: the code goes back into the address bar just before
     the parent adds the icon, and the manifest is left out on iPhones so that address is the one that is kept. */
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const standalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  if (isIOS) { const m = document.querySelector('link[rel=manifest]'); if (m) m.remove(); }
  const INSTALL = 'cs_portal_install';
  let installEvt = null, installHelp = false, curCode = '';
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (child) renderInstall(); });
  window.addEventListener('appinstalled', () => { installEvt = null; try { localStorage.setItem(INSTALL, 'done'); } catch (e) {} renderInstall(); });
  function renderInstall(){
    let off = ''; try { off = localStorage.getItem(INSTALL) || ''; } catch (e) {}
    const el = $('install');
    if (!child || !onPortal || D.demo || standalone() || off || !(installEvt || isIOS)) { el.innerHTML = ''; return; }
    el.innerHTML = `<div class="card install"><div><strong>Add the Parent Portal to your home screen</strong>` +
      (installHelp ? `<ol><li>Tap the <b>Share</b> button in Safari (the square with an arrow).</li><li>Choose <b>Add to Home Screen</b>.</li><li>Tap <b>Add</b>.</li></ol><div class="res-sub">The icon opens ${esc(child.name)}'s page directly. If you cannot see Share, open this page in Safari first.</div>`
        : `<div class="res-sub">Open it like an app, without typing the code again.</div>`) + `</div>
      <div class="acts">${installHelp ? '' : `<button class="btn" type="button" id="install-go">${isIOS ? 'Show me how' : 'Add to home screen'}</button>`}<button class="link" type="button" id="install-no">${installHelp ? 'Done' : 'Not now'}</button></div></div>`;
  }
  async function installGo(){
    if (installEvt) { const ev = installEvt; installEvt = null; try { ev.prompt(); await ev.userChoice; } catch (e) {} renderInstall(); return; }
    if (isIOS && curCode) { try { history.replaceState(null, '', location.pathname + location.search + '#' + CS.normCode(curCode)); } catch (e) {} installHelp = true; renderInstall(); }
  }
  function renderTopics(){
    $('h-topics').textContent = 'Weekly topics, ' + CS.yearLabel(child.year);
    const rows = content.topics.filter(x => termKey(x) === term);
    const hw = {}, subOrder = h => { const i = CS.HW_SUBJECTS.indexOf(h.sub); return h.sub === '*' ? -1 : i < 0 ? 99 : i; };
    (child.homework || []).forEach(h => { (hw[h.w] = hw[h.w] || []).push(h); });
    Object.values(hw).forEach(l => l.sort((a, b) => subOrder(a) - subOrder(b)));
    const first = String(child.name).split(' ')[0];
    const hwHtml = w => { const l = hw[w]; if (!l) return '';
      return `<div class="hwbox"><div class="hwbox-h">Homework check for ${esc(first)}</div>${w > 1 ? `<div class="muted" style="font-size:.85rem;margin:2px 0 6px">Checked in Week ${w}. This is the homework set in Week ${w - 1}.</div>` : ''}` + l.map(h => `<div class="hwc ${esc(h.s)}"><b>${h.sub === '*' ? 'All homework' : h.sub ? esc(h.sub) : h.s ? 'Homework' : 'Teacher\'s note'}</b>${h.s ? `<span class="st">${h.s === 'done' ? '' : '! '}${esc(CS.HW[h.s] || '')}</span>` : ''}${h.c ? `<p>${esc(h.c)}</p>` : ''}</div>`).join('') + msgLinks(`Week ${w} homework check`, true) + '</div>'; };
    if (!rows.length && !Object.keys(hw).length) { $('topics').innerHTML = `<div class="card"><p class="empty">No topics have been posted for ${esc(CS.yearLabel(child.year))} this term yet.</p></div>`; return; }
    const weeks = [...new Set(rows.map(x => x.w).concat(Object.keys(hw).map(Number)))].sort((a, b) => b - a);
    $('topics').innerHTML = weeks.map((w, i) => `<article class="card"><div class="week-head"><h3>Week ${esc(w)}</h3>${i === 0 ? '<span class="pill">Latest</span>' : ''}</div>` +
      rows.filter(x => x.w === w).map(x => `<div class="topic"><div class="subj">${esc(x.subject)}</div><div>${esc(x.topic)}${x.hw ? `<div class="hw"><b>Homework:</b> ${esc(x.hw)}</div>` : ''}</div></div>`).join('') + hwHtml(w) + '</article>').join('');
  }
  function renderResults(){
    const list = child.results.filter(x => termKey(x) === term).sort((a, b) => b.w - a.w || a.subject.localeCompare(b.subject));
    const pct = (v, max) => Math.max(0, Math.min(100, max ? v / max * 100 : 0));
    paperList = [];
    const first = String(child.name).split(' ')[0];
    $('results').innerHTML = list.length ? list.map(r => `<div class="res"><div class="res-top"><div><div class="res-title">${esc(r.title)}</div><div class="res-sub">${esc(r.subject)} · Week ${esc(r.w)}</div></div>
          ${r.score != null ? `<div class="score">${esc(r.score)}<small> / ${esc(r.max)}</small></div>` : ''}</div>
        ${r.score != null ? `<div class="bar" role="img" aria-label="${Math.round(pct(r.score, r.max))} percent"><i style="width:${pct(r.score, r.max)}%"></i>${r.avg != null ? `<b style="left:${pct(r.avg, r.max)}%"></b>` : ''}</div>
        <div class="cap">${r.avg != null ? `<span class="k"></span>Class average ${esc(r.avg)} · Highest ${esc(r.high)} · ${esc(r.n)} students` : 'Class average is shown when three or more students sit the test'}</div>` : ''}
        ${r.scan ? attHtml(Object.assign({ label: `${first}'s marked test paper` }, r.scan, { name: `${child.name} ${r.title}${/\.[a-z0-9]+$/i.test(r.scan.name || '') ? r.scan.name.slice(r.scan.name.lastIndexOf('.')) : '.pdf'}` }), paperList, 'paper') : ''}</div>`).join('')
      : '<p class="empty">No mini test results have been posted this term yet.</p>';
    attMount($('results'), paperList, 'paper');
  }
  function render(){
    $('centre').textContent = D.centre.name;
    $('demo').innerHTML = D.demo ? `<div class="demo">Example data, all names are made up. To open the portal, enter the access code <code>${esc(D.demo.code)}</code>.</div>` : '';
    $('foot').innerHTML = `<span><b>Blacktown</b> Campus</span><span>${esc(D.centre.phone)}</span><span>${esc(D.centre.email)}</span><span>${esc(D.centre.address)}</span>`;
    $('gate').hidden = !!child; $('open').hidden = !child; $('meta').hidden = !child;
    if (!child) { renderGate(); return; }
    const ts = terms(), one = ts.length < 2;
    $('term').hidden = one; $('term-label').hidden = one; $('term-one').hidden = !one;
    $('term-one').textContent = 'Term ' + term.split('-')[1] + ', ' + term.split('-')[0];
    $('term').innerHTML = ts.map(k => { const [y, t] = k.split('-'); return `<option value="${k}"${k === term ? ' selected' : ''}>Term ${t}, ${y}</option>`; }).join('');
    $('updated').textContent = 'Updated ' + new Date(D.generated).toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' });
    $('who').innerHTML = `<div><strong>${esc(child.name)}</strong><span class="res-sub"> ${esc(CS.yearLabel(child.year))}${child.extra ? ' and ' + esc(CS.yearLabel(child.extra)) : ''}${child.cls ? ' · ' + esc(child.cls) : ''}</span></div><button class="link" id="signout" type="button">Use a different code</button>`;
    const noticesOnly = CS.isTrial(child.year);
    $('grid').hidden = noticesOnly;
    renderInstall(); renderNotices(); renderReports(); renderContact();
    if (noticesOnly) { if (!content.notices.length) $('notices').innerHTML = '<h2>Notices</h2><div class="card"><p class="empty">No notices have been posted yet.</p></div>'; return; }
    renderTopics(); renderResults();
  }

  async function unlock(code, quiet){
    busy = true; error = ''; if (!quiet) renderGate();
    let rec = null;
    try { rec = await CS.open(D, code); if (rec) content = await CS.openYear(D, rec); } catch (e) { rec = null; }
    busy = false;
    if (rec) { child = rec; curCode = code; remember.set(code); logVisit(); }
    else if (quiet) remember.set('');
    else error = 'That code or link did not open the portal. Check each letter and digit. Codes stop working when a student is no longer enrolled.';
    render();
    if (!rec && !quiet) { const i = $('code'); if (i) { i.value = code; i.focus(); } }
  }

  document.addEventListener('submit', e => { if (e.target.id === 'codeform') { e.preventDefault(); if (!busy) unlock($('code').value, false); } });
  document.addEventListener('click', e => { if (e.target.id === 'install-go') { installGo(); return; }
    if (e.target.id === 'install-no') { try { localStorage.setItem(INSTALL, installHelp ? 'done' : 'no'); } catch (x) {} if (installHelp) { try { history.replaceState(null, '', location.pathname + location.search); } catch (x) {} } installHelp = false; renderInstall(); return; }
    const ab = e.target.closest('[data-att]'); if (ab && child) { openAtt(+ab.dataset.att, attList, renderNotices, 'file'); return; }
    const pb = e.target.closest('[data-paper]'); if (pb && child) { openAtt(+pb.dataset.paper, paperList, renderResults, 'test paper'); return; }
    const pt = e.target.closest('[data-papertoggle]'); if (pt && child) { const f = paperList[+pt.dataset.papertoggle], st = f && repState[f.file]; if (st) { st.hidden = !st.hidden; renderResults(); } return; }
    const at2 = e.target.closest('[data-atttoggle]'); if (at2 && child) { const f = attList[+at2.dataset.atttoggle], st = f && repState[f.file]; if (st) { st.hidden = !st.hidden; renderNotices(); } return; }
    const rb = e.target.closest('[data-rep]'); if (rb && child) { openReport(+rb.dataset.rep); return; }
    const tg = e.target.closest('[data-reptoggle]'); if (tg && child) { const r = repList()[+tg.dataset.reptoggle], st = r && repState[r.file]; if (st) { st.hidden = !st.hidden; renderReports(); } return; }
    if (e.target.id === 'signout') { child = null; content = { topics: [], notices: [] }; remember.set(''); render(); } });
  $('term').addEventListener('change', e => { term = e.target.value; render(); });

  render();
  /* A personal link carries the child's code after the # sign. Use it once, then take it out of the address bar. */
  const linked = CS.normCode(decodeURIComponent(location.hash.slice(1)));
  window.__linked = linked; // kept so a switch to a newer page version can carry the code along
  if (linked.length >= 8) {
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    unlock(linked, false);
  } else {
    const saved = remember.get();
    if (saved) unlock(saved, true);
  }
})();
</script>
</body>
</html>
