<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>CS Education Homework Marker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
/* Homework Marker: a phone-first page for markers. It can read the class lists and write homework checks, nothing else. */
:root{--bg:#f6f4f4;--surface:#fff;--ink:#231f20;--muted:#6a6465;--line:#e3dddd;--red:#ed1c24;--red-deep:#b01319;--bad:#8a4b00;--good:#1a7f47;--part:#c77700;
  --stripes:linear-gradient(90deg,#ed1c24 0 8.33%,#d91920 8.33% 16.66%,#cd171e 16.66% 25%,#ed1c24 25% 33.33%,#cd171e 33.33% 41.66%,#ed1c24 41.66% 50%,#d91920 50% 58.33%,#cd171e 58.33% 66.66%,#ed1c24 66.66% 75%,#cd171e 75% 83.33%,#ed1c24 83.33% 91.66%,#d91920 91.66% 100%);
  color-scheme:light}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45}
.band{height:8px;background:var(--stripes)}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 48px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;padding:14px 0}
.logo svg{display:block;height:38px;width:auto}
h1{font-size:1.35rem;font-weight:400;margin:0}h1 b{font-weight:800}
h2{font-size:1.08rem;margin:0 0 8px}
select,input,button,textarea{font:inherit;color:inherit}
select,input,textarea{background:var(--surface);border:1px solid #bdb5b6;border-radius:4px;padding:9px 10px;width:100%}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:12px}
.btn{background:var(--red-deep);color:#fff;border:1px solid var(--red-deep);border-radius:4px;padding:10px 14px;font-weight:700;cursor:pointer}
.btn.ghost{background:var(--surface);color:var(--red-deep)}
.link{background:none;border:0;color:var(--red-deep);text-decoration:underline;cursor:pointer;padding:0}
.pill{font-size:.82rem;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--surface);white-space:nowrap}
.pill.ok{color:var(--good);border-color:var(--good)}.pill.saving{color:var(--red-deep);border-color:var(--red-deep)}.pill.bad{color:var(--bad);border-color:var(--bad);background:#fff6e8}
.years{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px}
.years button{flex:0 0 auto;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:600;cursor:pointer}
.years button[aria-pressed=true]{background:var(--red-deep);border-color:var(--red-deep);color:#fff}
.bar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.fld{display:block;font-size:.84rem;font-weight:600;color:var(--muted)}.fld select,.fld input{margin-top:3px;color:var(--ink);font-weight:400;font-size:1rem}
.grow{flex:1 1 160px}
.note{color:var(--muted);font-size:.9rem;margin:8px 0 0}
.err{color:var(--bad);font-weight:700;border-left:3px solid var(--bad);padding-left:9px;margin:8px 0 0}
.stu{border-left:4px solid var(--line)}
.stu.flag{border-left:6px solid var(--red);background:#fff8f7}
.stu h3{margin:0 0 8px;font-size:1.02rem}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:8px}
.seg button{background:var(--surface);border:1px solid #bdb5b6;border-radius:4px;padding:8px 6px;cursor:pointer;min-height:52px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted)}
.seg button span{font-size:.82rem;font-weight:600;color:var(--ink)}.seg button b{font-size:.88rem;font-weight:600}
.seg button.no{background:var(--red-deep);border-color:var(--red-deep);color:#fff}.seg button.part{background:var(--part);border-color:var(--part);color:#fff}
.seg button.no span,.seg button.part span{color:#fff}.seg button.no b,.seg button.part b{font-weight:800}
.seg button.done{background:#e4f4ea;border-color:#9fd1b3;color:#14633a}
.chk{display:flex;gap:8px;align-items:center;margin-top:8px;cursor:pointer}.chk input{width:auto;flex:0 0 auto}
.by{color:var(--muted);font-size:.8rem;margin-top:4px}
.qr{max-width:240px;margin:10px auto}.qr svg{width:100%;height:auto;display:block}
</style>
</head>

<script>/* Shared logic for the office tool and the parent portal. No DOM access here. */
const CS = (() => {
  const ALPHA = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; // 31 characters, no I L O 0 1
  /* Groups a student can belong to: Year 1 to 12, plus the two trial test classes. A student is in exactly one. */
  const TRIAL = { ST: 'Selective Trial', OC: 'OC Trial' };
  const YEARS = Array.from({ length: 12 }, (_, i) => 'Y' + (i + 1)).concat(Object.keys(TRIAL));
  const SUBJECTS = ['Mathematics', 'English', 'Reading', 'Writing', 'Thinking Skills', 'Mathematical Reasoning', 'General Ability', 'Science'];
  const ITER = 200000;
  const MIN_FOR_AVERAGE = 3; // below this a class average would reveal another child's mark
  const enc = new TextEncoder(), dec = new TextDecoder();

  const b64 = u8 => { let s = ''; for (const b of u8) s += String.fromCharCode(b); return btoa(s); };
  const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const hex = u8 => Array.from(u8, b => b.toString(16).padStart(2, '0')).join('');
  const normCode = c => String(c || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const isTrial = g => !!TRIAL[g]; // trial classes get notices only: no weekly topics or mini tests
  const yearLabel = y => TRIAL[y] || 'Year ' + String(y).replace(/^Y/i, '');

  function newCode() {
    let out = ''; const buf = new Uint8Array(1);
    while (out.length < 10) { crypto.getRandomValues(buf); if (buf[0] < 248) out += ALPHA[buf[0] % 31]; }
    return out.slice(0, 5) + '-' + out.slice(5);
  }

  async function derive(code, saltB64, iter) {
    const km = await crypto.subtle.importKey('raw', enc.encode(normCode(code)), 'PBKDF2', false, ['deriveBits']);
    const bits = new Uint8Array(await crypto.subtle.deriveBits(
      { name: 'PBKDF2', salt: b64d(saltB64), iterations: iter, hash: 'SHA-256' }, km, 384));
    const key = await crypto.subtle.importKey('raw', bits.slice(16, 48), 'AES-GCM', false, ['encrypt', 'decrypt']);
    return { tag: hex(bits.slice(0, 16)), key };
  }

  async function seal(obj, code, saltB64, iter) {
    const { tag, key } = await derive(code, saltB64, iter);
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(JSON.stringify(obj))));
    return { tag, iv: b64(iv), ct: b64(ct) };
  }

  /* Returns the child's record, or null when the code matches nothing. */
  async function open(D, code) {
    if (normCode(code).length < 6) return null;
    const { tag, key } = await derive(code, D.salt, D.iter);
    const b = D.blobs[tag];
    if (!b) return null;
    try {
      const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(b.iv) }, key, b64d(b.ct));
      return JSON.parse(dec.decode(pt));
    } catch (e) { return null; }
  }

  /* A report PDF is locked with its own random key before it is uploaded. The key travels inside the
     child's sealed record, so the uploaded file is unreadable to anyone else. Layout: 12-byte iv, then the data. */
  async function sealFile(bytes) {
    const raw = crypto.getRandomValues(new Uint8Array(32)), iv = crypto.getRandomValues(new Uint8Array(12));
    const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt']);
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, bytes));
    const out = new Uint8Array(12 + ct.length); out.set(iv); out.set(ct, 12);
    return { key: b64(raw), bytes: out };
  }
  async function openFile(bytes, keyB64) {
    const u = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);
    const key = await crypto.subtle.importKey('raw', b64d(keyB64), 'AES-GCM', false, ['decrypt']);
    return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u.slice(0, 12) }, key, u.slice(12)));
  }

  /* Scores are kept per calendar year, because the same test is reused with each year's students. */
  function testStats(test, yr) {
    const vals = Object.values((test.scoresByYear || {})[yr] || {}).filter(v => typeof v === 'number' && !isNaN(v));
    const n = vals.length;
    if (!n) return { n: 0, avg: null, high: null };
    return { n, avg: Math.round(vals.reduce((a, b) => a + b, 0) / n * 10) / 10, high: Math.max(...vals) };
  }

  function emptyState() {
    return {
      version: 1,
      centre: { name: 'CS Education Blacktown', phone: '02 9621 7711', email: 'blacktown@cseducation.com.au', address: 'Level 1, 19 Campbell St, Blacktown NSW 2148' },
      current: { yr: new Date().getFullYear(), t: 4, w: 0 }, // w 0 = show every week of the term
      portalUrl: 'https://blacktown-cs.github.io/portal/',
      mail: { url: '', key: '' }, lastPublished: '',
      students: [], topics: [], tests: [], notices: [], reports: [], homework: [], scans: []
    };
  }

  /* Opens the topics and notices for the child's year, using the year key held inside the child's record. */
  /* Opens what the child's groups hold: topics come from the year, notices from the year and, when the
     child is also in a trial class, from that class too. Each group has its own key inside the child's record. */
  async function openYear(D, rec) {
    const out = { topics: [], notices: [] }, seen = {};
    for (const g of rec.groups || []) {
      const y = D.years && D.years[g.g];
      if (!y || !g.yk) continue;
      try {
        const key = await crypto.subtle.importKey('raw', b64d(g.yk), 'AES-GCM', false, ['decrypt']);
        const c = JSON.parse(dec.decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(y.iv) }, key, b64d(y.ct))));
        if (g.g === rec.year) out.topics = rec.topics || c.topics || [];
        for (const n of c.notices || []) { const k = n.date + '|' + n.title; if (!seen[k]) { seen[k] = 1; out.notices.push(n); } }
      } catch (e) {}
    }
    for (const n of rec.notices || []) out.notices.push(n);
    return out;
  }

  /* A student has one year (or one trial class), and may also be in a trial class on top of a year. */
  const groupsOf = s => [s.year].concat(s.extra && isTrial(s.extra) && s.extra !== s.year && !isTrial(s.year) ? [s.extra] : []);
  const inGroup = (s, g) => groupsOf(s).includes(g);

  /* Which weeks parents see: every week (w 0), weeks 1 to w, or week w alone (only). */
  const weekShown = (cur, w) => !cur.w || (cur.only ? w === cur.w : w <= cur.w);
  /* The week setting at the top right is the default. A year can have its own, and a single student can have
     their own on top of that. Stored as text: '' same as the level above, '0' all weeks, '3' up to week 3, 'o3' week 3 only. */
  const parseRule = v => { const m = /^(o?)(\d{1,2})$/.exec(String(v == null ? '' : v)); return m ? { w: +m[2], only: !!m[1] && +m[2] > 0 } : null; };
  const ruleForYear = (state, y) => Object.assign({ yr: state.current.yr, t: state.current.t, w: state.current.w || 0, only: !!state.current.only }, parseRule(((state.weekRules || {}).years || {})[y]) || {});
  const ownRule = (state, s) => parseRule(((state.weekRules || {}).students || {})[s.id]);
  const ruleFor = (state, s) => Object.assign(ruleForYear(state, s.year), ownRule(state, s) || {});
  const weekLabel = cur => !cur.w ? 'all weeks' : cur.only ? 'Week ' + cur.w + ' only' : 'up to Week ' + cur.w;
  /* Homework checks can be entered on several devices. Two copies are merged check by check: the one changed last wins. */
  const hwKey = h => [h.sid, h.yr, h.t, h.w, h.sub || ''].join('|');
  /* Homework is checked per subject. Checks made before subjects existed have no subject and show as General. */
  const HW_SUBJECTS = ['English', 'Math', 'GA/Thinking Skills', 'Science'];
  function mergeHw(a, b) {
    const m = {};
    for (const h of [...(a || []), ...(b || [])]) { const k = hwKey(h); if (!m[k] || (h.at || 0) > (m[k].at || 0)) m[k] = h; }
    return Object.keys(m).sort().map(k => m[k]);
  }
  /* Homework is marked by exception: the marker flags only the subjects that were not done (or partly done) and may
     leave a note. A week marked as checked for the class (an entry for '@' + year) tells every other family
     that all homework was completed. */
  function hwFor(state, s, rule) {
    const cur = state.current, all = (state.homework || []).filter(h => h.yr === cur.yr && h.t === cur.t && weekShown(rule, h.w));
    const out = all.filter(h => h.sid === s.id && (h.s || h.c)).map(h => ({ w: h.w, sub: h.sub || '', s: h.s || '', c: h.c || '' }));
    for (const k of all.filter(h => h.sid === '@' + s.year && h.s === 'checked'))
      if (!out.some(h => h.w === k.w && h.s)) out.push({ w: k.w, sub: '*', s: 'done', c: '' });
    return out;
  }
  const isActive = s => s.active !== false;
  const HW = { done: 'Completed', part: 'Partly completed', no: 'Not completed' };

  /* Builds what the parent portal file carries. Nothing about students, topics or notices is left readable:
     each year's topics and notices are locked with a fresh key, and that key sits inside the sealed record
     of every enrolled student in that year. */
  async function buildPortalData(state, onProgress) {
    const salt = b64(crypto.getRandomValues(new Uint8Array(16)));
    const blobs = {}, years = {}, yearKey = {}, cur = state.current;
    const noticeOut = n => ({ date: n.date, title: n.title, body: n.body, years: n.years || [], files: (n.files || []).map(f => ({ name: f.name, type: f.type || '', file: f.file, key: f.key, size: f.size, inline: f.inline })) });
    const topicOut = x => ({ yr: cur.yr, t: x.t, w: x.w, subject: x.subject, topic: x.topic, hw: x.hw || '' });
    const list = state.students.filter(s => normCode(s.code) && isActive(s));
    for (const y of [...new Set(list.flatMap(groupsOf))]) {
      const raw = crypto.getRandomValues(new Uint8Array(32));
      const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt']);
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const content = {
        topics: isTrial(y) ? [] : state.topics.filter(x => x.y === y && x.t === cur.t && weekShown(ruleForYear(state, y), x.w)).map(topicOut),
        /* a personal notice never goes into a year's shared list: it travels only inside the chosen children's own records */
        notices: (state.notices || []).filter(n => !n.personal && (!n.years || !n.years.length || n.years.includes(y))).map(noticeOut)
      };
      const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(JSON.stringify(content))));
      years[y] = { iv: b64(iv), ct: b64(ct) }; yearKey[y] = b64(raw);
    }
    let done = 0;
    for (const s of list) {
      const results = [], mine = ruleFor(state, s), own = !isTrial(s.year) && ownRule(state, s);
      /* parents see the current term only: earlier terms and years stay in the office tool */
      for (const t of isTrial(s.year) ? [] : state.tests.filter(x => x.t === cur.t && weekShown(mine, x.w))) for (const yr of [String(cur.yr)]) {
        const raw = ((t.scoresByYear || {})[yr] || {})[s.id], has = typeof raw === 'number' && !isNaN(raw), score = has ? raw : null;
        const sn = (state.scans || []).find(x => x.sid === s.id && x.tid === t.id && String(x.yr) === yr);
        if (!has && !sn) continue;
        const st = testStats(t, yr);
        const show = st.n >= MIN_FOR_AVERAGE;
        results.push({ yr: +yr, t: t.t, w: t.w, subject: t.subject, title: t.title, date: t.date || '', score, max: t.max,
          avg: show ? st.avg : null, high: show ? st.high : null, n: st.n,
          scan: sn ? { name: sn.name, type: sn.type || '', file: sn.file, key: sn.key, size: sn.size, inline: sn.inline } : undefined });
      }
      const sealed = await seal({ name: s.name, year: s.year, extra: groupsOf(s)[1] || '', cls: s.cls || '', groups: groupsOf(s).map(g => ({ g, yk: yearKey[g] })), results,
        notices: (state.notices || []).filter(n => n.personal && (n.sids || []).includes(s.id)).map(n => Object.assign(noticeOut(n), { personal: true, years: [] })),
        /* a student with their own week setting carries their own topic list, which the portal shows in place of the year's shared list */
        topics: own ? state.topics.filter(x => x.y === s.year && x.t === cur.t && weekShown(mine, x.w)).map(topicOut) : undefined,
        homework: isTrial(s.year) ? [] : hwFor(state, s, mine),
        reports: (state.reports || []).filter(r => r.sid === s.id).map(r => ({ yr: r.yr, t: r.t, file: r.file, key: r.key, size: r.size, inline: r.inline })) }, s.code, salt, ITER);
      blobs[sealed.tag] = { iv: sealed.iv, ct: sealed.ct };
      done++; if (onProgress) onProgress(done, list.length);
    }
    return { centre: state.centre, visit: state.visit && state.visit.on !== false && state.visit.id ? { id: state.visit.id, entry: state.visit.entry } : undefined, base: (state.portalUrl || '').replace(/#.*$/, ''), generated: new Date().toISOString(), current: state.current, salt, iter: ITER, blobs, years };
  }

  /* Brings data saved by an earlier version up to date: topics and tests are the same every year,
     only the scores belong to a calendar year. */
  function migrate(st) {
    const yrNow = (st.current && st.current.yr) || new Date().getFullYear();
    (st.topics || []).forEach(x => { delete x.yr; });
    /* a class note such as "also OC Trial" becomes real membership of that trial class */
    (st.students || []).forEach(s => { const m = /^also\s+(oc|selective)\s+trial$/i.exec(String(s.cls || '').trim()); if (m && !s.extra) { s.extra = /^oc$/i.test(m[1]) ? 'OC' : 'ST'; s.cls = ''; } });
    (st.tests || []).forEach(t => {
      if (!t.scoresByYear) t.scoresByYear = {};
      if (t.scores) { const y = t.yr || yrNow; t.scoresByYear[y] = Object.assign(t.scoresByYear[y] || {}, t.scores); delete t.scores; }
      delete t.yr;
    });
    if (st.current && st.current.w == null) {
      const ws = (st.topics || []).filter(x => x.t === st.current.t).map(x => x.w);
      st.current.w = ws.length ? Math.max.apply(null, ws) : 1;
    }
    return st;
  }

  function fillTemplate(tpl, data) {
    return tpl.split('/*__PORTAL_' + 'DATA__*/null').join(JSON.stringify(data).replace(/</g, '\\u003c'));
  }

  return { hwFor, HW_SUBJECTS, parseRule, ruleForYear, ruleFor, ownRule, mergeHw, weekShown, weekLabel, HW, sealFile, openFile, b64, b64d, YEARS, TRIAL, isTrial, groupsOf, inGroup, SUBJECTS, MIN_FOR_AVERAGE, normCode, uid, yearLabel, newCode, open, openYear, isActive, testStats, emptyState, buildPortalData, fillTemplate, migrate };
})();
if (typeof module !== 'undefined') module.exports = CS;
</script>
<script>
(function(){
  const GH = { owner: 'blacktown-cs', repo: 'homework-marker', branch: 'main' };
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const store = { get(k){ try { return localStorage.getItem(k) || ''; } catch(e){ return ''; } }, set(k, v){ try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch(e){} } };
  const TOKEN = 'cs_marker_token', NAME = 'cs_marker_name', LAST = 'cs_marker_last';
  let roster = null, entries = [], sha = null, dirty = false, busy = false, timer = null, problem = '', showQr = false, loaded = false;
  const last = (() => { try { return JSON.parse(store.get(LAST)) || {}; } catch(e){ return {}; } })();
  const ui = { year: last.year || '', week: last.week || 0 };

  /* A setup link carries the marker key after the # sign. Keep it on this device and take it out of the address bar. */
  const linked = /^#k=(.+)$/.exec(location.hash);
  if (linked) { store.set(TOKEN, decodeURIComponent(linked[1])); try { history.replaceState(null, '', location.pathname); } catch (e) {} }

  function api(path, method, body){
    return fetch(`https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${path}` + (method === 'GET' ? '?ref=' + GH.branch : ''), {
      method, cache: 'no-store', body: body ? JSON.stringify(body) : undefined,
      headers: { 'Authorization': 'Bearer ' + store.get(TOKEN), 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' } });
  }
  const fromB64 = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g, '')), c => c.charCodeAt(0)));
  const toB64 = str => { const u = new TextEncoder().encode(str); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
  async function read(path){
    const g = await api(path, 'GET'); if (!g.ok) return { status: g.status };
    const j = await g.json(); let text = j.content ? fromB64(j.content) : '';
    if (!text && j.download_url) text = await (await fetch(`https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${path}?ref=${GH.branch}`, { cache: 'no-store', headers: { 'Authorization': 'Bearer ' + store.get(TOKEN), 'Accept': 'application/vnd.github.raw+json' } })).text();
    return { status: 200, sha: j.sha, data: JSON.parse(text) };
  }
  function pill(kind, text){ const el = $('sync'); el.hidden = !text; el.className = 'pill ' + kind; el.textContent = text; }
  const clock = () => new Date().toLocaleTimeString('en-AU', { hour: 'numeric', minute: '2-digit' });

  async function load(){
    if (!store.get(TOKEN) || busy) return;
    busy = true;
    try {
      const r = await read('roster.json');
      if (r.status === 401) problem = 'This device\'s marker key was not accepted. It may have been replaced. Ask the office for the new setup code.';
      else if (r.status === 404 || r.status === 403) problem = 'The class lists are not available yet. Ask the office to open the Student Manager once, then try again.';
      else if (r.status !== 200) problem = 'GitHub answered with error ' + r.status + '. Try again in a minute.';
      else {
        roster = r.data; problem = '';
        const c = await read('checks.json');
        if (c.status === 200) { entries = dirty ? CS.mergeHw(entries, c.data.entries || []) : (c.data.entries || []); sha = c.sha; }
        else if (c.status === 404) { sha = null; }
        loaded = true; if (!dirty) pill('ok', 'Up to date ' + clock());
      }
    } catch (e) { if (!loaded) problem = 'No internet connection. Connect and try again.'; pill('bad', 'Offline'); }
    busy = false;
    const a = document.activeElement; if (!(a && a.dataset && a.dataset.c)) render();
    if (dirty) schedule();
  }
  function schedule(){ dirty = true; pill('saving', 'Saving…'); clearTimeout(timer); timer = setTimeout(push, 1500); }
  async function push(){
    if (busy) { schedule(); return; }
    busy = true;
    try {
      for (let tries = 0; tries < 4; tries++) {
        const snapshot = JSON.stringify(entries);
        const p = await api('checks.json', 'PUT', { message: 'Homework checks', content: toB64(JSON.stringify({ entries })), sha: sha || undefined, branch: GH.branch });
        if (p.ok) { sha = (await p.json()).content.sha; dirty = JSON.stringify(entries) !== snapshot; if (!dirty) pill('ok', 'Saved ' + clock()); break; }
        if (p.status === 409 || p.status === 422) { const c = await read('checks.json'); if (c.status === 200) { entries = CS.mergeHw(entries, c.data.entries || []); sha = c.sha; } else sha = null; continue; }
        pill('bad', p.status === 401 ? 'Key rejected' : 'Not saved'); break;
      }
    } catch (e) { pill('bad', 'Offline, will retry'); clearTimeout(timer); timer = setTimeout(push, 8000); }
    busy = false; if (dirty && !timer) schedule();
  }

  const cur = () => roster.current;
  const get = (sid, sub) => entries.find(h => h.sid === sid && h.yr === cur().yr && h.t === cur().t && h.w === ui.week && (h.sub || '') === sub);
  function put(sid, sub, patch){
    let h = get(sid, sub);
    if (!h) { h = { sid, yr: cur().yr, t: cur().t, w: ui.week, sub, s: '', c: '' }; entries.push(h); }
    Object.assign(h, patch, { at: Date.now(), by: store.get(NAME) }); schedule();
  }
  const checked = () => { const h = get('@' + ui.year, ''); return !!h && h.s === 'checked'; };
  const flagged = sid => CS.HW_SUBJECTS.some(sub => { const h = get(sid, sub); return h && (h.s === 'no' || h.s === 'part'); });
  const CHIP = { '': '—', no: 'Not done', part: 'Partly', done: 'Done' };
  function years(){ return CS.YEARS.filter(y => roster.students.some(s => s.year === y)); }
  function render(){
    const v = $('view');
    if (!store.get(TOKEN)) { $('sync').hidden = true; v.innerHTML = `<div class="card"><h2>Set up this device</h2>
      <p class="note" style="margin-top:0">Scan the setup code shown on a device that is already set up, or paste the marker key the office gave you.</p>
      <form id="f-key"><label class="fld">Marker key<input id="key" type="password" autocomplete="off" placeholder="github_pat_..."></label>
      <div style="margin-top:10px"><button class="btn" type="submit">Save on this device</button></div></form></div>`; return; }
    if (problem) { v.innerHTML = `<div class="card"><p class="err" role="alert" style="margin:0 0 12px">${esc(problem)}</p><button class="btn" type="button" data-act="retry">Try again</button> <button class="link" type="button" data-act="forget" style="margin-left:12px">Remove the key from this device</button></div>`; return; }
    if (!roster) { v.innerHTML = '<div class="card"><p class="note" style="margin:0">Loading the class lists…</p></div>'; return; }
    const ys = years(); if (!ys.includes(ui.year)) ui.year = ys[0] || '';
    if (!ui.week) ui.week = cur().w || 1;
    store.set(LAST, JSON.stringify({ year: ui.year, week: ui.week }));
    const list = roster.students.filter(s => s.year === ui.year).sort((a, b) => a.name.localeCompare(b.name));
    const set = (roster.hw || []).filter(x => x.y === ui.year && x.w === ui.week);
    const bad = list.filter(s => flagged(s.id)).length;
    v.innerHTML = `<div class="years" role="group" aria-label="Year">${ys.map(y => `<button type="button" data-act="year" data-y="${y}" aria-pressed="${y === ui.year}">${esc(CS.yearLabel(y))}</button>`).join('')}</div>
      <div class="card"><div class="bar"><label class="fld">Week<select id="week">${Array.from({ length: 12 }, (_, i) => `<option value="${i + 1}"${i + 1 === ui.week ? ' selected' : ''}>Week ${i + 1}</option>`).join('')}</select></label>
          <label class="fld grow">Your name (shown to the office)<input id="me" value="${esc(store.get(NAME))}" autocomplete="name"></label></div>
        <p class="note"><b>Term ${esc(cur().t)}, ${esc(cur().yr)} · ${esc(CS.yearLabel(ui.year))} · Week ${ui.week}.</b> ${set.length ? 'Homework set: ' + set.map(x => esc(x.subject) + ': ' + esc(x.hw)).join(' · ') : ''}</p>
        <p class="note">Mark only what was <b>not</b> done. Tap a subject once for <b>Not done</b>, again for <b>Partly</b>, again for <b>Done</b>, once more to clear. While the box below is ticked, students left blank show parents as completed.</p>
        <label class="chk"><input type="checkbox" id="chk"${checked() ? ' checked' : ''}> <b>Week ${ui.week} homework has been checked</b></label>
        <p class="note" id="count">${bad} of ${list.length} students have homework not completed. Parents see it after the office publishes.</p></div>` +
      (list.length ? list.map(s => { const memo = get(s.id, '') || {}; return `<div class="card stu ${flagged(s.id) ? 'flag' : ''}" data-sid="${s.id}"><h3>${esc(s.name)}${s.cls ? ` <span class="by">${esc(s.cls)}</span>` : ''}</h3>
        <div class="seg" role="group" aria-label="Homework for ${esc(s.name)}">${CS.HW_SUBJECTS.map(sub => { const st = (get(s.id, sub) || {}).s || ''; return `<button type="button" data-act="chip" data-sub="${esc(sub)}" class="${st}"><span>${esc(sub)}</span><b>${CHIP[st]}</b></button>`; }).join('')}</div>
        <input data-c="1" value="${esc(memo.c || '')}" maxlength="400" placeholder="Note for the parent (optional)" aria-label="Note for ${esc(s.name)}">
        ${memo.by && memo.c ? `<div class="by">Note by ${esc(memo.by)}</div>` : ''}</div>`; }).join('') : '<div class="card"><p class="note" style="margin:0">No students in this year.</p></div>') +
      `<div class="card"><button class="link" type="button" data-act="qr">${showQr ? 'Hide the setup code' : 'Set up another device'}</button>
        ${showQr ? `<div class="qr">${qr(location.origin + location.pathname + '#k=' + encodeURIComponent(store.get(TOKEN)))}</div><p class="note">Scan this with the camera of the other phone or tablet. Show it to markers only: anyone who scans it can enter homework checks.</p>` : ''}
        <div style="margin-top:10px"><button class="link" type="button" data-act="forget">Remove the key from this device</button></div></div>`;
  }
  function qr(text){ try { const q = qrcode(0, 'L'); q.addData(text); q.make(); return q.createSvgTag({ cellSize: 3, margin: 2, scalable: true }); } catch (e) { return ''; } }
  const armed = new WeakMap();

  document.addEventListener('submit', e => { if (e.target.id !== 'f-key') return; e.preventDefault(); const k = $('key').value.trim(); if (k) { store.set(TOKEN, k); render(); load(); } });
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b) return; const a = b.dataset.act;
    if (a === 'year') { ui.year = b.dataset.y; render(); }
    else if (a === 'chip') { const sid = b.closest('[data-sid]').dataset.sid, c = (get(sid, b.dataset.sub) || {}).s || '', next = c === '' ? 'no' : c === 'no' ? 'part' : c === 'part' ? 'done' : ''; put(sid, b.dataset.sub, { s: next }); if (next && !checked()) put('@' + ui.year, '', { s: 'checked' }); render(); }
    else if (a === 'qr') { showQr = !showQr; render(); }
    else if (a === 'retry') { problem = ''; roster = null; render(); load(); }
    else if (a === 'forget') { if (armed.get(b)) { store.set(TOKEN, ''); roster = null; entries = []; sha = null; loaded = false; problem = ''; showQr = false; render(); } else { armed.set(b, true); b.textContent = 'Tap again to remove the key'; setTimeout(() => armed.delete(b), 3000); } }
  });
  document.addEventListener('change', e => {
    const el = e.target;
    if (el.id === 'week') { ui.week = +el.value; render(); }
    else if (el.id === 'me') store.set(NAME, el.value.trim());
    else if (el.id === 'chk') put('@' + ui.year, '', { s: el.checked ? 'checked' : '' });
    else if (el.dataset.c) put(el.closest('[data-sid]').dataset.sid, '', { c: el.value.trim() });
  });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !dirty) load(); });
  setInterval(() => { if (!document.hidden && !dirty && store.get(TOKEN) && !problem) load(); }, 60000);
  window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

  render(); load();
})();
</script>
</body>
</html>
